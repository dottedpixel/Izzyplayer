###########################################################
# IzzyPlayer – Default Configuration                      #
# Universal fallback for unknown systems                  #
###########################################################

###########################################################
# GPU Renderer – auto detection                           #
###########################################################
gpu-api=auto
hwdec=auto

###########################################################
# OSD / OSC – Hide all overlays                          #
###########################################################
osc=no
osd-level=0
osd-bar=no
cursor-autohide=always

###########################################################
# Fullscreen                                              #
###########################################################
fs=yes
border=no
geometry=100%x100%+0+0
autofit=100%x100%

###########################################################
# Motion & Frame Rate                                     #
###########################################################
video-sync=display-resample

###########################################################
# Scaling – balanced quality/performance                  #
###########################################################
scale=spline36
dscale=mitchell
cscale=spline36
correct-downscaling=yes
sigmoid-upscaling=yes

###########################################################
# Color Management                                        #
###########################################################
target-prim=auto
target-trc=auto
dither-depth=auto

###########################################################
# Performance & Buffering                                 #
###########################################################
cache=yes
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=100MiB
hr-seek-framedrop=no

###########################################################
# Subtitles                                               #
###########################################################
sub-font-size=42
