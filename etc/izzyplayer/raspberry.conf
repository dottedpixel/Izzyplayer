###########################################################
# IzzyPlayer – Raspberry Pi Configuration                 #
# Optimized for RPi 4 (1080p) and RPi 5 (4K)             #
# No desktop required – DRM/KMS direct output             #
###########################################################

###########################################################
# Video Output – DRM/KMS (no desktop needed)              #
###########################################################
vo=drm
gpu-api=opengl
hwdec=v4l2m2m

###########################################################
# Display Output                                          #
###########################################################
fs=yes
border=no
geometry=100%x100%+0+0

###########################################################
# CPU Optimization – use all cores                        #
###########################################################
vd-lavc-threads=4

###########################################################
# Motion & Frame Rate                                     #
###########################################################
video-sync=display-resample

###########################################################
# Scaling – lightweight for RPi                           #
###########################################################
scale=bilinear
dscale=bilinear
cscale=bilinear
interpolation=no
deband=no

###########################################################
# Performance & Buffering                                 #
###########################################################
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
hr-seek-framedrop=yes

###########################################################
# Audio                                                   #
###########################################################
ao=alsa

###########################################################
# Subtitles                                               #
###########################################################
sub-font-size=38

###########################################################
# Autostart – for autonomous mode                         #
###########################################################
# loop-file=inf
# fullscreen=yes
