###########################################################
# IzzyPlayer – macOS Configuration                        #
# Optimized for Apple Silicon and Intel Mac               #
###########################################################

###########################################################
# GPU Renderer                                            #
###########################################################
gpu-api=vulkan
hwdec=videotoolbox
macos-force-dedicated-gpu=yes

###########################################################
# Fullscreen                                              #
###########################################################
fs=yes
native-fs=no
border=no
geometry=100%x100%+0+0
autofit=100%x100%

###########################################################
# Motion & Frame Rate Synchronization                     #
###########################################################
video-sync=display-resample
interpolation=yes
tscale=sphinx
tscale-blur=0.699155638
tscale-radius=1.05
tscale-clamp=0.0

###########################################################
# High-Quality Scaling                                    #
###########################################################
scale=ewa_lanczossharp
dscale=mitchell
cscale=ewa_lanczossharp
scale-antiring=0.7
dscale-antiring=0.7
cscale-antiring=0.7
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

###########################################################
# Color Management & HDR                                  #
###########################################################
target-prim=auto
target-trc=auto
tone-mapping=bt.2446a
hdr-compute-peak=yes
dither-depth=auto

###########################################################
# Debanding                                               #
###########################################################
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=48

###########################################################
# Performance & Buffering                                 #
###########################################################
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=200MiB
hr-seek-framedrop=no

###########################################################
# Subtitles                                               #
###########################################################
sub-font=Helvetica Neue
sub-font-size=42
